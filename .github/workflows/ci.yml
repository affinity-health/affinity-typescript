name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      # `bun run check` regenerates src/generated with Fern in Docker and compares it.
      - run: docker version --format '{{.Server.Version}}'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run pack:dry-run
