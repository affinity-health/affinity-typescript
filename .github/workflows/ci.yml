name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run pack:dry-run
