name: Publish npm release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # npm provenance only accepts GitHub-hosted runners.
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install --frozen-lockfile
      - name: Verify release tag and package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$version"
      - run: bun run check
      - name: Publish proving release
        if: github.event_name == 'release' && github.event.release.prerelease
        run: npm publish --access public --provenance --tag next
      - name: Publish stable release
        if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
        run: npm publish --access public --provenance --tag latest
